# Stage 2: baseline NR Standalone scenario -- one gNB, UPF, remote server, 5 static UEs at
# increasing distance receiving DL CBR traffic. Confirms the end-to-end chain
# (server -> UPF/GTP -> gNB -> NR stack -> UE) and the distance/SINR/throughput trend.
# Run: scripts/sim.sh -i baseline.ini ...   (see scripts/run_baseline.sh)

[General]
network = simu5g.simulations.nr.networks.SingleCell_Standalone
sim-time-limit = 10s
seed-set = ${repetition}
repeat = 5
**.routingRecorder.enabled = false
**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false
**.vector-recording = false
output-scalar-file = ${resultdir}/Baseline/${configname}-rep${repetition}.sca
output-vector-file = ${resultdir}/Baseline/${configname}-rep${repetition}.vec
*.configurator.config = xmldoc("config/demo.xml")

*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1      # 30 kHz, 0.5 ms slots
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 51            # ~20 MHz
**.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
**.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.gnb.cellularNic.numCarriers = 1
*.ue[*].cellularNic.numNrCarriers = 1
*.gnb.cellularNic.channelModelType = "Tr36873ChannelModel"
*.ue[*].cellularNic.nrChannelModelType = "Tr36873ChannelModel"
**.scenario = "URBAN_MACROCELL"
**.targetBler = 0.01
**.fbPeriod = 40tti
**.pilotMode = "AVG_CQI"
**.downlinkInterference = false
**.uplinkInterference = false
**.vector-recording = false

**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

*.gnb.mobility.initialX = 500m
*.gnb.mobility.initialY = 500m

*.numUe = 5
*.ue[*].mobility.typename = "StationaryMobility"
*.ue[0].mobility.initialX = 550m   # 50 m
*.ue[0].mobility.initialY = 500m
*.ue[1].mobility.initialX = 500m   # 150 m
*.ue[1].mobility.initialY = 650m
*.ue[2].mobility.initialX = 200m   # 300 m
*.ue[2].mobility.initialY = 500m
*.ue[3].mobility.initialX = 500m   # 450 m
*.ue[3].mobility.initialY = 50m
*.ue[4].mobility.initialX = 900m   # 400 m, 0 m off-axis -> second far UE
*.ue[4].mobility.initialY = 500m
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
**.dynamicCellAssociation = false
**.enableHandover = false

*.ue[*].numApps = 1
*.ue[*].app[0].typename = "CbrReceiver"
*.ue[*].app[0].localPort = 3000
*.server.numApps = 5
*.server.app[*].typename = "CbrSender"
*.server.app[*].packetSize = 1000B
*.server.app[*].samplingTime = 4ms     # 2 Mbit/s per UE
*.server.app[*].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort = 3000
*.server.app[*].localPort = 3088 + ancestorIndex(0)
*.server.app[*].startTime = uniform(0s, 0.02s)

[Config Baseline]
