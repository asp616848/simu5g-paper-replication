# Variant B (hypothesis test): all 57 cells are full-stack gNBs; 54 saturating "load" UEs keep the
# 54 non-central cells at 100% load; the 30 measured UEs may attach to ANY of the 57 cells
# (best signal), as in the 3GPP calibration. Same radio parameters as UrbanMacro (omnetpp.ini).
include omnetpp.ini

[Config UrbanMacroFull]
network = validation.networks.UrbanMacroFull
description = "57 full gNBs variant of the UMa validation scenario"
include config/layout_full.ini
*.numUe = 84
*.server.numApps = 84
*.ue[30..83].numApps = 1
*.binder.blerShift = ${delta=0,3,5,7}
output-scalar-file = ${resultdir}/UrbanMacroFull/delta${delta}-rep${repetition}.sca
output-vector-file = ${resultdir}/UrbanMacroFull/delta${delta}-rep${repetition}.vec
