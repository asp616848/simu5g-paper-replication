# Simu5G paper replication (Nardini et al., IEEE Access 2020) -- Sec. IV-E validation.
# Stage 2: [Config Baseline]   Stage 3: [Config UrbanMacro] (+ Delta sweep via blerShift)
#
# Run via scripts/run_*.sh; per-repetition UE drops come from positions/rep<N>.ini
# (scripts/gen_positions.py) passed as a second ini file.

[General]
abstract = true
**.routingRecorder.enabled = false
**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false
**.measuredSinrDl:vector.vector-recording = true   # only the SINR samples are kept as vectors
**.vector-recording = false
**.scalar-recording = true
seed-set = ${repetition}
repeat = 50
sim-time-limit = 10s
warmup-period = 1s

*.configurator.config = xmldoc("config/demo.xml")

# ---------------------------------------------------------------- PHY (Table 2)
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].numerologyIndex = 0     # 15 kHz, 1 ms TTI (FDD)
*.carrierAggregation.componentCarrier[0].carrierFrequency = 700MHz
*.carrierAggregation.componentCarrier[0].numBands = 50           # 10 MHz = 50 PRBs

**.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
**.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.gnb[*].cellularNic.numCarriers = 1
*.ue[*].cellularNic.numNrCarriers = 1

# propagation: 3GPP TR 36.873 3D-UMa, shadowing + (Jakes) fading
*.gnb[*].cellularNic.channelModelType = "Tr36873ChannelModel"
*.ue[*].cellularNic.nrChannelModelType = "Tr36873ChannelModel"
**.scenario = "URBAN_MACROCELL"
**.shadowing = true
**.dynamicLos = false              # NLOS-only (Simu5G default): matches the paper-era behaviour; the UMa NLOS
                                   # formula is floored by the LOS one. (dynamicLos=true + deterministicLos=true
                                   # enables the TR 36.873 LOS probability, see README)
**.indoorFraction = 0.8            # 80% of UEs indoor (O2I penetration), consistent on all links
**.fading = true
**.nodebHeight = 25m
**.ueHeight = 1.5m
**.antennGainEnB = 8dBi            # gNB antenna gain
**.antennaGainUe = 0dBi            # UE antenna gain
**.cableLoss = 0dB                 # none listed in Table 2
**.bsNoiseFigure = 5dBm            # = 5 dB noise figure (NED declares the unit as dBm)
**.ueNoiseFigure = 7dBm
**.eNodeBTxPower = 46dBm           # gNB Tx power
**.targetBler = 0.01
**.fbPeriod = 40tti
**.pilotMode = "AVG_CQI"
**.collectSinrStatistics = true

# ----------------------------------------------------------------- scenario
*.numExtCells = 54
*.extCell[*].txPower = 46dBm
*.extCell[*].txDirection = "ANISOTROPIC"
*.extCell[*].carrierFrequency = 0.7GHz
*.extCell[*].numBands = 50
*.extCell[*].bandAllocationType = "FULL_ALLOC"   # 100% load of interfering cells
*.extCell[*].bandUtilization = 1.0

**.downlinkInterference = true     # interference among the 3 full gNBs
**.uplinkInterference = false      # DL-only traffic
**.extCellInterference = true
**.enableExtCellLos = false        # interferers use the NLOS path loss, not the serving link's LOS state
**.bgCellInterference = false

# UEs: pedestrian linear mobility (3 km/h); positions, indoor/outdoor from rep files
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 2400m
**.mobility.constraintAreaMaxY = 2400m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false
*.ue[*].mobility.typename = "LinearMobility"
*.ue[*].mobility.speed = 3kmph
*.ue[*].mobility.initialMovementHeading = uniform(0deg, 360deg)

# UEs attach once, to the cell with the best signal; no handover in this scenario
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
**.dynamicCellAssociation = true
**.enableHandover = false

# DL CBR 240 kbps per UE (60 B every 2 ms)
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "CbrReceiver"
*.ue[*].app[0].localPort = 3000
*.server.numApps = ${numUEs=30}
*.server.app[*].typename = "CbrSender"
*.server.app[*].packetSize = 60B
*.server.app[*].samplingTime = 2ms
*.server.app[*].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort = 3000
*.server.app[*].localPort = 3088 + ancestorIndex(0)
*.server.app[*].startTime = uniform(0s, 0.02s)

include config/layout.ini

# =============================================================== Stage 3
[Config UrbanMacro]
network = validation.networks.UrbanMacro
description = "3GPP UMa calibration scenario, 57 cells, 30 UEs"
# Delta of the paper (receiver sensitivity offset applied to the BLER curves)
*.binder.blerShift = ${delta=0,3,5,7}
output-scalar-file = ${resultdir}/${configname}/delta${delta}-rep${repetition}.sca
output-vector-file = ${resultdir}/${configname}/delta${delta}-rep${repetition}.vec

# Same scenario without fast fading (isolates the effect of fading on the HARQ error rates)
[Config UrbanMacroNoFading]
extends = UrbanMacro
description = "UrbanMacro with fast fading disabled"
**.fading = false
